name: AST Pocket SAB Guideline Edition Watch
on:
  schedule:
    # Monday 05:45 JST = Sunday 20:45 UTC; schedule may be delayed.
    - cron: '45 20 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edition-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate evidence ledger
        run: node scripts/test-evidence-ledger.mjs && node scripts/test-guideline-version-watch.mjs
      - name: Compare IDSA SAB Part 1 official update date
        run: node scripts/watch-official-sab-guideline.mjs
