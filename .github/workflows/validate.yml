name: Validate AST Pocket
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/organisms.json','utf8')); JSON.parse(require('fs').readFileSync('data/antibiotics.json','utf8')); JSON.parse(require('fs').readFileSync('content/index.json','utf8')); JSON.parse(require('fs').readFileSync('content/review/questions.json','utf8')); console.log('JSON OK')"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate nightly learning intake core and CLI
        run: |
          node --check scripts/daily-ingest-core.mjs
          node --check scripts/import-daily-learning.mjs
          node --check scripts/check-weekly-safety.mjs
      - name: Test daily ChatGPT learning draft conversion, duplicate and privacy checks
        run: node scripts/test-daily-ingest.mjs
      - name: Screen indexed Weekly for privacy red flags
        run: node scripts/check-weekly-safety.mjs
      - name: Validate dictionary and Weekly index
        run: node scripts/validate-content.mjs
      - name: Validate six-category Weekly auto-organizer
        run: node scripts/organize-weekly.mjs --check
      - name: Test automatic classification and source provenance
        run: node scripts/test-organizer.mjs
      - name: Validate integration proposal generator
        run: node scripts/organize-weekly.mjs --write && node scripts/propose-integrations.mjs --write && node scripts/test-integrations.mjs
      - name: Smoke test integration views and clinical safety
        run: node scripts/test-integration-ui.mjs
      - name: Test return navigation from Weekly to source note
        run: node scripts/test-weekly-return.mjs
      - name: Check review modules syntax
        run: |
          node --check review-engine.mjs
          node --check review-store.mjs
          node --check review-feature.mjs
      - name: Test JST review scheduler, draft safety and backup import
        run: node scripts/test-review-v2.mjs
      - name: Test daily quiz rendering and clinical-mode isolation
        run: node scripts/test-review-ui.mjs
      - name: Validate detailed MSSA notebook module syntax
        run: node --check mssa-notebook.mjs
      - name: Test 8-chapter MSSA notebook, reading resume and draft safety
        run: node scripts/test-mssa-notebook.mjs
      - name: Validate six reusable notebook templates and chapter routing
        run: node --check notebook-templates.mjs && node scripts/test-notebook-templates.mjs
      - name: Verify real dated CAP and HAP daily learning into infection notebook
        run: node scripts/test-daily-live-pilot.mjs
      - name: Check nightly ingest watchdog module and JST status classification
        run: node --check scripts/audit-nightly-ingest.mjs && node scripts/test-nightly-ingest-audit.mjs
      - name: Validate private ChatGPT export intake and AI textbook draft gate
        run: |
          node --check scripts/read-private-chat-export.mjs
          node --check scripts/study-pipeline-core.mjs
          node --check scripts/render-chatgpt-draft.mjs
          node --check scripts/check-guideline-excerpts.mjs
          node --check scripts/weekly-to-study-packet.mjs
          node scripts/test-ai-study-pipeline.mjs
          node scripts/test-weekly-to-packet.mjs
          node --check scripts/note-revision-core.mjs
          node --check scripts/review-note-revision.mjs
          node scripts/test-note-revision.mjs
          node scripts/test-two-detailed-textbooks.mjs
          node --check scripts/check-evidence-ledger.mjs
          node scripts/test-evidence-ledger.mjs
          node scripts/check-evidence-ledger.mjs
          node --check scripts/watch-official-sab-guideline.mjs
          node scripts/test-guideline-version-watch.mjs
          node --check scripts/triage-evidence-gaps.mjs
          node scripts/test-evidence-gap-triage.mjs
          node --check scripts/build-weekly-review-pack.mjs
          node scripts/test-weekly-review-pack.mjs
      - name: Verify 2026-10-14 to 21 real learning and fungal topic routing
        run: node --check scripts/test-weekly-seven-day-recovery.mjs && node scripts/test-weekly-seven-day-recovery.mjs
      - name: Validate eight chapter antifungal summary from October study
        run: node scripts/test-antifungal-textbook-draft.mjs
      - name: Verify AmpC learning module
        run: node --check ampc-study.mjs && node scripts/test-ampc-study.mjs && node scripts/test-ampc-ui.mjs
      - name: Check antifungal spectrum source table and study-only display
        run: node --check antifungal-spectrum.mjs && node --check app.js && node scripts/test-antifungal-spectrum.mjs && node scripts/test-antifungal-spectrum-ui.mjs
      - name: Verify iPhone installed-app updates and fresh deploy caching
        run: node --check app-update.mjs && node --check scripts/prepare-pages-version.mjs && node scripts/test-app-update.mjs
      - name: Check required files
        run: test -f index.html && test -f app.js && test -f styles.css
