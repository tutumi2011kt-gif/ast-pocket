name: Validate AST Pocket
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/organisms.json','utf8')); JSON.parse(require('fs').readFileSync('data/antibiotics.json','utf8')); JSON.parse(require('fs').readFileSync('content/index.json','utf8')); JSON.parse(require('fs').readFileSync('content/review/questions.json','utf8')); console.log('JSON OK')"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate dictionary and Weekly index
        run: node scripts/validate-content.mjs
      - name: Validate six-category Weekly auto-organizer
        run: node scripts/organize-weekly.mjs --check
      - name: Test automatic classification and source provenance
        run: node scripts/test-organizer.mjs
      - name: Validate integration proposal generator
        run: node scripts/organize-weekly.mjs --write && node scripts/propose-integrations.mjs --write && node scripts/test-integrations.mjs
      - name: Check required files
        run: test -f index.html && test -f app.js && test -f styles.css
